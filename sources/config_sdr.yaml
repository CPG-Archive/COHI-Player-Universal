# Configuration file of COHI-Player-Universal.
# The basic settings (hwconfig, program_variant, display_variant) can also be
# changed with the configuration tools cohi_config_gui.py or
# cohi_config_setup.py. Changes take effect after restarting the program.
# Please do not add comments at the end of a value line - the configuration
# tools replace the whole line.


# ---------------------------------------------------------------------------
# General
# ---------------------------------------------------------------------------

# Language of the user interface (dialogs, labels, status messages):
#   en   - English (default)
#   de   - German (Deutsch)
#   auto - follows the system language (German system -> German,
#          everything else -> English)
# The log file (system_log.log) is always written in English.
language: en

# Output hardware:
#   stemlab - STEMlab 125-14 / Red Pitaya (with the COHI STEMlab firmware)
#   fl2k    - FL2K USB-to-VGA dongle (osmo-fl2k)
hwconfig: fl2k

# Only for hwconfig: stemlab - IP address of the STEMlab.
# 0.0.0.0 (or empty) = search automatically on the local network; the
# address found is then saved here.
address: 0.0.0.0

# Directories with the WAV recordings. Any number of entries is possible
# (filename, filename2, filename3, ...); subdirectories are searched as well.
# Only files whose name ends with "_0.wav" are found. Directories that do not
# exist (e.g. a USB stick that is not plugged in) are simply skipped.
filename: /media/pi
filename2: /home/pi/COHIRADIA/WAV

# true = the shutdown button also shuts down the computer (Raspberry Pi or
# Windows PC); with STEMlab the STEMlab is always shut down as well.
# false = only the program is closed.
shutdown: false

# Modulation level. 1.0 = typical value for STEMlab and FL2K alike (the
# automatic level adjustment takes care of the rest). Only change it for
# unusually quiet (> 1.0) or loud (< 1.0) recordings.
autovol: 1.0

# Automatic level adjustment (AGC):
#   0   - the level is measured once at the start of each track (default)
#   > 0 - additionally, a level measurement is written to the log file every
#         N seconds (for diagnosis only - the gain is not changed)
agc_interval: 0

# Log file system_log.log:
#   session - created anew at every program start (default)
#   append  - keeps growing across program runs (for longer troubleshooting)
#   off     - no log file, output on the console only
log_mode: session


# ---------------------------------------------------------------------------
# Program mode and display
# ---------------------------------------------------------------------------

# Program mode:
#   COHI-Player        - replay of WAV band recordings only (default)
#   COHI-Stream        - internet live streams only
#   COHI-Player+Stream - both at the same time (recommended: Raspberry Pi 5)
# The live stream modes require hwconfig: stemlab, or hwconfig: fl2k together
# with fl2k_upconverter: cpp.
program_variant: COHI-Player

# Display size:
#   1 - small display, 3.5" (480x320 pixels)
#   2 - large display, 7" or larger
display_variant: 1

# Additional debug windows showing the output signal:
#   debug_spectrum_window   - spectrum and waterfall
#   debug_timedomain_window - waveform
# Only effective with display_variant: 2. Requires the Python package
# pyqtgraph (pip install pyqtgraph --break-system-packages).
debug_spectrum_window: false
debug_timedomain_window: false


# ---------------------------------------------------------------------------
# FL2K (only for hwconfig: fl2k)
# ---------------------------------------------------------------------------

# Digital upconverter:
#   cpp    - compiled C++ tool, lowest CPU load (recommended, required for
#            COHI-Stream and COHI-Player+Stream). Compile it beforehand with
#            "make" - always on the device on which it will run.
#   native - Python/NumPy, without ffmpeg (sufficient on a Raspberry Pi 5,
#            too slow on a Raspberry Pi 4)
#   ffmpeg - via ffmpeg (high CPU load; mainly for Windows)
fl2k_upconverter: cpp

# Optional paths to fl2k_file and ffmpeg. Without these entries the programs
# are searched in the PATH (Linux) or in default subdirectories of the program
# directory (Windows). Example for Windows:
# fl2k_path: C:\fl2k\fl2k_file.exe
# ffmpeg_path: C:\ffmpeg\bin\ffmpeg.exe

# Optional path to the C++ tool cohi_native_upconverter. Without this entry it
# is expected in the program directory.
# fl2k_cpp_upconverter_path: /home/pi/cohi-player/cohi_native_upconverter


# ---------------------------------------------------------------------------
# COHI-Stream (only for program_variant: COHI-Stream or COHI-Player+Stream)
# ---------------------------------------------------------------------------

# Station list (CSV, semicolon-separated, columns:
# Frequenz;Bandbreite;Programmname;URL). The list can be loaded, edited and
# saved in the program; the program remembers the list used last and prefers
# it to this entry.
live_stations_file: Web-Streams.csv

# Only for hwconfig: stemlab together with program_variant: COHI-Stream.
# The live stations are generated around a centre frequency (LO) and
# transmitted with the given sample rate. All stations must lie within
# LO +/- (sample rate / 2). In COHI-Player+Stream both values are taken from
# the WAV recording and the two entries are ignored.
# Centre frequency in Hz:
stemlab_live_lo_freq: 1125000
# Sample rate in Hz - one of 20000, 50000, 100000, 250000, 500000, 1250000,
# 2500000. Recommended: 1250000 (covers the whole medium wave band,
# 526.5 - 1606.5 kHz); 2500000 can cause crackling.
stemlab_live_sample_rate: 1250000

# Optional path to the C++ tool cohi_stemlab_live_upconverter. Without this
# entry it is expected in the program directory.
# stemlab_live_upconverter_path: /home/pi/cohi-player/cohi_stemlab_live_upconverter
